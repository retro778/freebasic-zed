name = "FreeBASIC"
grammar = "freebasic"
path_suffixes = ["bas", "bi"]
line_comments = ["' ", "'"]
block_comment = ["/' ", " '/"]
tab_size = 4
hard_tabs = false
autoindent_using_last_non_empty_line = true

brackets = [
    { start = "(", end = ")", close = true, newline = false },
    { start = "[", end = "]", close = true, newline = false },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
]
